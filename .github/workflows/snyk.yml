name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_call:

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Check SNYK_TOKEN is configured
        id: has_token
        run: echo "set=${{ secrets.SNYK_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check token availability
        if: steps.has_token.outputs.set != 'true'
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && { [ "${{ github.event.pull_request.head.repo.fork }}" = true ] || [ "${{ github.actor }}" = 'dependabot[bot]' ]; }; then
            echo "::warning::Snyk is skipped because this pull request cannot access repository secrets."
          else
            echo "::error::SNYK_TOKEN is missing."
            exit 1
          fi

      - name: Install Snyk CLI
        if: steps.has_token.outputs.set == 'true'
        run: npm install -g snyk@1

      # Findings are surfaced via SARIF upload to the Security tab rather
      # than failing the build: several current issues are transitive
      # vulnerabilities inside @backstage/* itself with no upstream fix yet
      # (mirrors the local pre-push hook's snyk step).
      - name: Snyk open source (dependency) scan
        if: steps.has_token.outputs.set == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --fail-fast --severity-threshold=high --sarif-file-output=snyk-oss.sarif || [ "$?" -eq 1 ]

      - name: Snyk code (static analysis) scan
        if: steps.has_token.outputs.set == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif || [ "$?" -eq 1 ]

      - name: Upload Snyk results to code scanning
        if: ${{ always() && steps.has_token.outputs.set == 'true' && github.ref_type != 'tag' && hashFiles('snyk-*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
