name: Publish to npm

# Release process:
#   git tag ai-agents@X.Y.Z          # or ai-agents-backend@X.Y.Z
#                                    # or ai-agents-backend-module-agentcore@X.Y.Z
#                                    # or ai-agents-backend-module-kagent@X.Y.Z
#   git push origin ai-agents@X.Y.Z
#
# The tag prefix selects which workspace package gets published, and its
# version must match the version already committed in that package's
# package.json.

on:
  push:
    tags:
      - "ai-agents@*"
      - "ai-agents-backend@*"
      - "ai-agents-backend-module-agentcore@*"
      - "ai-agents-backend-module-kagent@*"
  # Manual fallback when a tag can't be pushed: run the workflow on the commit
  # to release, passing the tag name (e.g. ai-agents@0.14.1). The GitHub
  # Release step then creates that tag on this commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. ai-agents@0.14.1"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package from tag
        id: pkg
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            ai-agents-backend@*)
              echo "dir=packages/plugin-ai-agents-backend" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#ai-agents-backend@}" >> "$GITHUB_OUTPUT"
              ;;
            ai-agents-backend-module-agentcore@*)
              echo "dir=packages/plugin-ai-agents-backend-module-agentcore" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#ai-agents-backend-module-agentcore@}" >> "$GITHUB_OUTPUT"
              ;;
            ai-agents-backend-module-kagent@*)
              echo "dir=packages/plugin-ai-agents-backend-module-kagent" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#ai-agents-backend-module-kagent@}" >> "$GITHUB_OUTPUT"
              ;;
            ai-agents@*)
              echo "dir=packages/plugin-ai-agents" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#ai-agents@}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unrecognized tag pattern: $TAG"
              exit 1
              ;;
          esac

      - name: Verify tag version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          TAG_VERSION="${{ steps.pkg.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match ${{ steps.pkg.outputs.dir }}/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        # Install from the repo root so intra-repo workspace deps
        # (e.g. the agentcore module depending on the backend core) resolve.
        # Backstage's MUI4 theme has a react@^17 peer dep; --legacy-peer-deps
        # mirrors local install behaviour and avoids npm@7+ ERESOLVE failures.
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      # Build every workspace in dependency order so intra-repo deps have
      # their dist/ ready before tsc type-checks against them.
      - name: Build
        run: npm run build --workspaces --if-present

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ steps.pkg.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true