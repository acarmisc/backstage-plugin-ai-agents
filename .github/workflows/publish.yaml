name: Publish to npm

# Release process:
#   git tag ai-agents@X.Y.Z          # or ai-agents-backend@X.Y.Z
#                                    # or ai-agents-backend-module-agentcore@X.Y.Z
#                                    # or ai-agents-backend-module-kagent@X.Y.Z
#                                    # or ai-agents-backend-module-langfuse@X.Y.Z
#   git push origin ai-agents@X.Y.Z
#
# The tag prefix selects which workspace package gets published, and its
# version must match the version already committed in that package's
# package.json. The full CI (quality, cleanliness, security) runs first;
# publishing only starts when every check passes.
#
# Requires the NPM_TOKEN repository secret (an npm granular access token
# with read/write on the @acarmisc packages).

on:
  push:
    tags:
      - 'ai-agents@*'
      - 'ai-agents-backend@*'
      - 'ai-agents-backend-module-agentcore@*'
      - 'ai-agents-backend-module-kagent@*'
      - 'ai-agents-backend-module-langfuse@*'
  # Manual fallback when a tag can't be pushed: run the workflow on the commit
  # to release, passing the tag name (e.g. ai-agents@0.14.1). The GitHub
  # Release step then creates that tag on this commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. ai-agents@0.14.1'
        required: true
        type: string
      release_only:
        description: >-
          Only create the tag and GitHub Release for a version that is
          already on npm (recovery when publishing succeeded but the
          release step did not).
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
      dir: ${{ steps.pkg.outputs.dir }}
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}
      url: ${{ steps.pkg.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check the commit is on main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package from tag
        id: pkg
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            ai-agents-backend-module-agentcore@*) DIR=packages/plugin-ai-agents-backend-module-agentcore ;;
            ai-agents-backend-module-kagent@*)    DIR=packages/plugin-ai-agents-backend-module-kagent ;;
            ai-agents-backend-module-langfuse@*)  DIR=packages/plugin-ai-agents-backend-module-langfuse ;;
            ai-agents-backend@*)                  DIR=packages/plugin-ai-agents-backend ;;
            ai-agents@*)                          DIR=packages/plugin-ai-agents ;;
            *)
              echo "::error::Unrecognized tag pattern: $TAG"
              exit 1
              ;;
          esac
          {
            echo "tag=$TAG"
            echo "dir=$DIR"
            echo "version=${TAG#*@}"
            NAME=$(node -p "require('./$DIR/package.json').name")
            echo "name=$NAME"
            # Registry URL of this exact version: 200 when published, 404
            # when not. Queried with curl, not `npm view`: setup-node's
            # .npmrc needs NODE_AUTH_TOKEN, and without it every `npm view`
            # fails, which reads as "not published".
            echo "url=https://registry.npmjs.org/${NAME/\//%2F}/${TAG#*@}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          TAG_VERSION="${{ steps.pkg.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match ${{ steps.pkg.outputs.dir }}/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify the commit is on main
        # Releases come from reviewed code only, never from a side branch.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; merge the release first."
            exit 1
          fi

      - name: Verify the version is not published yet (or is, for release_only)
        env:
          URL: ${{ steps.pkg.outputs.url }}
          SPEC: ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}
          RELEASE_ONLY: ${{ inputs.release_only || false }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          case "$RELEASE_ONLY:$status" in
            false:404|true:200) echo "$SPEC: registry answered $status" ;;
            false:200) echo "::error::$SPEC is already on npm; bump the version."; exit 1 ;;
            true:404) echo "::error::$SPEC is not on npm; release_only needs a published version."; exit 1 ;;
            *) echo "::error::Unexpected registry answer $status for $SPEC"; exit 1 ;;
          esac

  checks:
    name: CI
    needs: resolve
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      pull-requests: write

  publish:
    name: Publish ${{ needs.resolve.outputs.tag }}
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release + tag
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: ${{ !inputs.release_only }}
        # Install from the repo root so intra-repo workspace deps
        # (e.g. the agentcore module depending on the backend core) resolve.
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      # Build every workspace in dependency order so intra-repo deps have
      # their dist/ ready before tsc type-checks against them.
      - name: Build
        if: ${{ !inputs.release_only }}
        run: npm run build --workspaces --if-present

      - name: Check package contents
        if: ${{ !inputs.release_only }}
        run: node scripts/check-packages.mjs "${{ needs.resolve.outputs.dir }}"

      - name: Publish to npm
        if: ${{ !inputs.release_only }}
        working-directory: ${{ needs.resolve.outputs.dir }}
        # --ignore-scripts: the build above already produced dist/, and the
        # tarball checked in the previous step is exactly what is published.
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the release on npm
        env:
          URL: ${{ needs.resolve.outputs.url }}
          SPEC: ${{ needs.resolve.outputs.name }}@${{ needs.resolve.outputs.version }}
        run: |
          # The registry can take a few minutes to serve a new version.
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = 200 ]; then
              echo "$SPEC is live on npm"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SPEC is not visible on npm after 5 minutes"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
