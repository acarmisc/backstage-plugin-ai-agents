# Sample AI agent entities for docs/dev reference. Register in a Backstage
# catalog via a Location pointing at this file, or paste individual entries
# into your catalog.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: support-triage-agent
  title: Support Triage Agent
  description: Classifies and routes incoming support tickets by severity and product area.
  tags: [ai-agent, llm, support]
  annotations:
    ai-agent.io/avatar: https://api.dicebear.com/7.x/bottts/svg?seed=triage
    ai-agent.io/runtime: bedrock-agentcore
    ai-agent.io/runtime-handle: arn:aws:bedrock:us-east-1:123:agent/TXXX
    ai-agent.io/region: us-east-1
    ai-agent.io/endpoint: https://abc.execute-api.us-east-1.amazonaws.com/prod
    ai-agent.io/health: https://abc.execute-api.us-east-1.amazonaws.com/prod/health
    ai-agent.io/billing-model: per-invocation
    ai-agent.io/cost-per-1k: "0.012"
    ai-agent.io/capabilities: "tool-use:tools,rag:retrieval,reasoning:reasoning"
    ai-agent.io/version: "1.4.2"
    ai-agent.io/hire-schema: '[{"name":"project","label":"Project","type":"text","required":true,"help":"GitLab project path, e.g. my-org/my-project"},{"name":"target","label":"MR IID","type":"text","required":true,"help":"Merge Request IID, e.g. 42"},{"name":"action","label":"Action","type":"select","required":true,"options":["dry-run","post"],"default":"dry-run","help":"dry-run = present only; post = post inline comments"}]'
    ai-agent.io/prompt-template: "Review merge request !{target} in project '{project}'. Action: {action}."
  links:
    - url: https://grafana.example.com/d/agents/support-triage
      title: Metrics
      icon: dashboard
    - url: https://docs.example.com/agents/support-triage
      title: Playbook
      icon: docs
spec:
  type: ai-agent
  lifecycle: production
  owner: cs-ops
  system: customer-support
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: invoice-reader-agent
  title: Invoice Reader
  description: Extracts structured data from uploaded invoices and receipts using OCR + LLM.
  tags: [ai-agent, vision]
  annotations:
    ai-agent.io/runtime: litellm
    ai-agent.io/runtime-handle: litellm/invoice-reader
    ai-agent.io/region: eu-west-1
    ai-agent.io/billing-model: per-token
    ai-agent.io/cost-per-1k: "2.40"
    ai-agent.io/capabilities: "vision:vision,ocr:vision,tools:tools"
    ai-agent.io/hire-schema: '[{"name":"project","label":"Project","type":"text","required":true},{"name":"documentBucket","label":"Document bucket URL","type":"url","required":true},{"name":"outputFormat","label":"Output format","type":"select","options":["json","csv","xlsx"],"default":"json"}]'
    ai-agent.io/prompt-template: "Extract structured data from documents at {documentBucket} for project '{project}'. Output format: {outputFormat}."
spec:
  type: ai-agent
  lifecycle: production
  owner: finance-ops
  system: invoicing
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kb-search-agent
  title: KB Search
  description: Answers internal questions grounded in the company knowledge base.
  tags: [ai-agent, rag]
  annotations:
    ai-agent.io/runtime: lambda
    ai-agent.io/runtime-handle: arn:aws:lambda:eu-west-1:123:function:kb-search
    ai-agent.io/region: eu-west-1
    ai-agent.io/endpoint: https://api.example.com/kb-search
    ai-agent.io/health: https://api.example.com/kb-search/health
    ai-agent.io/billing-model: free
    ai-agent.io/capabilities: "rag:retrieval,reasoning:reasoning"
    ai-agent.io/hire-schema: '[{"name":"project","label":"Project","type":"text","required":true},{"name":"kbIndex","label":"Knowledge base index","type":"text","required":true},{"name":"topK","label":"Top K results","type":"number","default":"5"}]'
    ai-agent.io/prompt-template: "Answer questions about project '{project}' using knowledge base '{kbIndex}', returning the top {topK} results."
spec:
  type: ai-agent
  lifecycle: experimental
  owner: platform-team
  system: devex
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: release-notes-agent
  title: Release Notes Writer
  description: Drafts user-facing release notes from merged merge requests.
  tags: [ai-agent, codegen]
  annotations:
    ai-agent.io/runtime: custom
    ai-agent.io/runtime-handle: relnote-svc
    ai-agent.io/region: eu-west-1
    ai-agent.io/endpoint: https://relnote.example.com/invoke
    ai-agent.io/billing-model: subscription
    ai-agent.io/capabilities: "codegen:tools,reasoning:reasoning"
    ai-agent.io/hire-schema: '[{"name":"project","label":"Project","type":"text","required":true},{"name":"repoUrl","label":"Repository URL","type":"url","required":true},{"name":"branch","label":"Branch","type":"text","default":"main"},{"name":"sinceTag","label":"Since tag","type":"text","help":"Optional: only include commits after this tag"}]'
    ai-agent.io/prompt-template: "Draft release notes for project '{project}' from {repoUrl} (branch: {branch}, since tag: {sinceTag})."
spec:
  type: ai-agent
  lifecycle: production
  owner: platform-team
  system: devex
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: legacy-classifier
  title: Legacy Classifier
  description: Legacy intent classifier — superseded by support-triage-agent.
  tags: [ai-agent]
  annotations:
    ai-agent.io/runtime: custom
    ai-agent.io/billing-model: per-invocation
    ai-agent.io/capabilities: "reasoning:reasoning"
spec:
  type: ai-agent
  lifecycle: deprecated
  owner: cs-ops
  system: customer-support
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: voice-ivr-agent
  title: Voice IVR
  description: Voice-driven IVR agent handling inbound calls.
  tags: [ai-agent, voice]
  annotations:
    ai-agent.io/runtime: bedrock-agentcore
    ai-agent.io/runtime-handle: voice-ivr-agent-runtime
    ai-agent.io/region: eu-west-1
    ai-agent.io/billing-model: per-invocation
    ai-agent.io/cost-per-1k: "0.040"
    ai-agent.io/capabilities: "voice:voice,reasoning:reasoning,tools:tools"
    ai-agent.io/hire-schema: '[{"name":"project","label":"Project","type":"text","required":true},{"name":"phoneNumberSid","label":"Phone number SID","type":"text","required":true},{"name":"language","label":"Language","type":"select","options":["en","it","es"],"default":"en"}]'
    ai-agent.io/prompt-template: "Handle inbound voice call for project '{project}' on phone number SID {phoneNumberSid} in language {language}."
spec:
  type: ai-agent
  lifecycle: experimental
  owner: cs-ops
  system: customer-support