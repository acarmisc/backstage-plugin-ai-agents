  title: Invoice Reader
  description: Extracts structured data from uploaded invoices and receipts using OCR + LLM.
  tags: [ai-agent, vision]
  annotations:
    ai-agent.acarmisc.org/runtime: litellm
    ai-agent.acarmisc.org/billing-model: per-token
    ai-agent.acarmisc.org/cost-per-1k: "2.40"
    ai-agent.acarmisc.org/capabilities: "vision:vision,ocr:vision,tools:tools"
spec:
  type: ai-agent
  lifecycle: production
  owner: finance-ops
  system: invoicing
